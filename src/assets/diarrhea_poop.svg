    <rect x="1" y="11" width="14" height="1" fill="#BBDEFB"/>
    <rect x="1" y="12" width="14" height="1" fill="#BBDEFB"/>
  </g>
  <!-- Face: Dizzy X_X -->
  <g fill="#212121">
    <!-- Left X -->
    <rect x="3" y="8" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/>
    <rect x="4" y="9" width="1" height="1"/>
    <rect x="3" y="10" width="1" height="1"/><rect x="5" y="10" width="1" height="1"/>
