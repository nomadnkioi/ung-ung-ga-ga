<svg width="48" height="48" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <g fill="#3E2723"> <!-- Outline -->
    <rect x="7" y="3" width="2" height="1"/>
    <rect x="6" y="4" width="1" height="1"/><rect x="9" y="4" width="1" height="1"/>
    <rect x="5" y="5" width="1" height="1"/><rect x="10" y="5" width="1" height="1"/>
    <rect x="4" y="6" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/>
    <rect x="3" y="7" width="1" height="1"/><rect x="12" y="7" width="1" height="1"/>
    <rect x="2" y="8" width="1" height="1"/><rect x="13" y="8" width="1" height="1"/>
    <rect x="1" y="9" width="1" height="2"/><rect x="14" y="9" width="1" height="2"/> 
