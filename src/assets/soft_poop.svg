<svg width="48" height="48" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <g fill="#3E2723"> <!-- Outline -->
    <rect x="6" y="6" width="4" height="1"/>
    <rect x="4" y="7" width="2" height="1"/><rect x="10" y="7" width="2" height="1"/>
    <rect x="3" y="8" width="1" height="1"/><rect x="12" y="8" width="1" height="1"/>
    <rect x="2" y="9" width="1" height="1"/><rect x="13" y="9" width="1" height="1"/>
    <rect x="1" y="10" width="1" height="3"/><rect x="14" y="10" width="1" height="3"/>
    <rect x="2" y="13" width="12" height="1"/>
  </g>
  <g fill="#A1887F"> <!-- Body (lighter softer brown) -->
    <rect x="6" y="7" width="4" height="1"/>
    <rect x="4" y="8" width="8" height="1"/>
    <rect x="3" y="9" width="10" height="1"/>
    <rect x="2" y="10" width="12" height="3"/>
  </g>
  <g fill="#212121"> <!-- Sleepy Eyes and Mouth -->
    <rect x="4" y="10" width="2" height="1"/> <!-- Sleepy Eye -->
    <rect x="10" y="10" width="2" height="1"/> <!-- Sleepy Eye -->
    <rect x="7" y="12" width="2" height="1"/> <!-- Mouth -->
  </g>
  <g fill="#F48FB1"> <!-- Blush -->
    <rect x="3" y="11" width="1" height="1"/>
    <rect x="12" y="11" width="1" height="1"/>
  </g>
  <!-- Sleepy snot bubble! -->
  <rect x="11" y="8" width="3" height="3" fill="#81D4FA" opacity="0.6"/>
  <rect x="12" y="9" width="1" height="1" fill="#FFFFFF" opacity="0.8"/>
</svg>
